org: rickydixon3
service: nexus

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - https://dfx81lmy69kmb.cloudfront.net
        - https://nexusnews.dev
      allowedMethods:
        - GET
        - POST
      allowedHeaders:
        - Content-Type
  iam:
    role:
      statements:
        - Effect: Allow
          Action: s3:PutObject
          Resource: arn:aws:s3:::nexus-raw-articles-rickydixon3/*
        - Effect: Allow
          Action: s3:GetObject
          Resource: arn:aws:s3:::nexus-raw-articles-rickydixon3/*
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: arn:aws:secretsmanager:us-east-1:512830091587:secret:nexus/api-keys-mxfDGf
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: arn:aws:secretsmanager:us-east-1:512830091587:secret:nexus/db-credentials-ksmwNm
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:us-east-1:512830091587:function:nexus-dev-normalize
            - arn:aws:lambda:us-east-1:512830091587:function:nexus-dev-embed

custom:
  pythonRequirements:
    dockerizePip: true
    useDownloadCache: false
    useStaticCache: false

    
functions:
  ingest:
    handler: ingest.ingest
    timeout: 240
    events:
      - schedule: rate(6 hours)

  normalize:
    handler: normalize.normalize
    timeout: 60

  embed:
    handler: embed.embed
    timeout: 300

  ragHandler:
    handler: rag_handler.rag_query
    timeout: 60
    events:
      - httpApi:
          path: /query
          method: post

  listArticles:
    handler: list_articles.list_articles
    timeout: 30
    events:
      - httpApi:
          path: /articles
          method: get

plugins:
  - serverless-python-requirements